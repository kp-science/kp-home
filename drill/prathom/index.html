<script>(function(){var K='kp-drill-theme';
try{var t=localStorage.getItem(K);if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
var b=document.createElement('button');b.className='themebtn';b.type='button';
function lab(){var d=document.documentElement.getAttribute('data-theme');
b.textContent=d==='dark'?'โหมดสว่าง':d==='light'?'โหมดตามเครื่อง':'โหมดมืด';}
b.onclick=function(){var d=document.documentElement.getAttribute('data-theme');
var n=d==='dark'?'light':d==='light'?'':'dark';
if(n)document.documentElement.setAttribute('data-theme',n);else document.documentElement.removeAttribute('data-theme');
try{n?localStorage.setItem(K,n):localStorage.removeItem(K);}catch(e){}lab();};
lab();var f=document.querySelector('footer');if(f)f.appendChild(b);})();</script>
<script src="../assets/art.js?v=14kwljl"></script>
<script src="../assets/rank.js?v=14kwljl"></script>
<script>(function(){
  var ha = document.getElementById('heroart');
  if (ha && window.KPART) ha.innerHTML = KPART.hero();
  var p = KPRANK.scan();
  document.querySelectorAll('.card-link[data-topic]').forEach(function(a){
    var t = p.topics[a.dataset.topic]; if(!t) return;
    var r = KPRANK.of(t.score, t.max);
    var d = document.createElement('div'); d.className='card-prog';
    d.textContent = 'ทำถึงระดับ ' + t.lv + ' · ยศ ' + r.name + ' · ' + t.points + ' แต้ม';
    a.appendChild(d);
  });
  var box = document.getElementById('profile'); if(!box) return;
  if(p.max === 0){
    box.innerHTML = '<div class="rk"><div class="rk-name">ยังไม่ได้เริ่ม</div>' +
      '<div class="rk-next">เลือกหัวข้อสักอัน ทำไปสัก 5 ข้อ แล้วยศจะขึ้นที่นี่</div></div>';
    return;
  }
  var r = KPRANK.of(p.score, p.max);
  box.innerHTML = KPRANK.barHTML(r) +
    '<div class="rk-topics"><span>แต้มรวม ' + p.points + '</span>' +
    '<span>หัวข้อที่เล่นแล้ว ' + Object.keys(p.topics).length + '</span>' +
    (p.done ? '<span>ทำครบทุกระดับ ' + p.done + ' หัวข้อ</span>' : '') + '</div>';
})();</script>
